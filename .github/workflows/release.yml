name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c 'import ast,pathlib; text=pathlib.Path("src/hubla_cli/version.py").read_text(); print(ast.literal_eval(text.split("=", 1)[1].strip()))')
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
