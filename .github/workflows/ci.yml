name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src/hubla_cli --ignore-missing-imports --check-untyped-defs
      - name: Format
        run: ruff format --check .
      - name: Tests with coverage gate
        if: runner.os == 'Linux'
        run: pytest --cov=hubla_cli --cov-report=term --cov-fail-under=80 -q
      - name: Cross-platform tests
        if: runner.os != 'Linux'
        run: pytest -q
      - name: Generated documentation
        run: python scripts/generate_command_reference.py --check
      - name: Validate Bash installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  installer-bootstrap:
    name: Installer bootstrap / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap missing Python on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          HUBLA_CLI_FORCE_MANAGED_PYTHON: "1"
          HUBLA_CLI_FORCE_UV_INSTALL: "1"
          HUBLA_CLI_PACKAGE_URL: ${{ github.workspace }}
          HUBLA_CLI_HOME: ${{ runner.temp }}/hubla-cli-bootstrap
          HUBLA_CLI_BIN_DIR: ${{ runner.temp }}/hubla-cli-bootstrap-bin
          HUBLA_CLI_SKIP_SKILL: "1"
        run: |
          bash install.sh
          "${HUBLA_CLI_BIN_DIR}/hubla-cli" --version
          test -x "${HUBLA_CLI_HOME}/bootstrap/uv"
      - name: Bootstrap missing Python on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          HUBLA_CLI_FORCE_MANAGED_PYTHON: "1"
          HUBLA_CLI_FORCE_UV_INSTALL: "1"
          HUBLA_CLI_PACKAGE_URL: ${{ github.workspace }}
          HUBLA_CLI_HOME: ${{ runner.temp }}/hubla-cli-bootstrap
          HUBLA_CLI_BIN_DIR: ${{ runner.temp }}/hubla-cli-bootstrap-bin
          HUBLA_CLI_SKIP_SKILL: "1"
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Este teste precisa executar no Windows PowerShell 5.1."
          }
          ./install.ps1
          & (Join-Path $env:HUBLA_CLI_BIN_DIR "hubla-cli.cmd") --version
          if ($LASTEXITCODE -ne 0) {
            throw "O executável instalado não respondeu."
          }
          if (-not (Test-Path (Join-Path $env:HUBLA_CLI_HOME "bootstrap/uv.exe"))) {
            throw "O bootstrap do uv não foi instalado."
          }

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, security, installer-bootstrap]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/hubla-cli-wheel
          /tmp/hubla-cli-wheel/bin/python -m pip install dist/*.whl
          /tmp/hubla-cli-wheel/bin/hubla-cli --version
          /tmp/hubla-cli-wheel/bin/hubla-cli --json schema sales list
          HOME=/tmp/hubla-cli-home /tmp/hubla-cli-wheel/bin/hubla-cli --json skill install --agent generic
          test -f /tmp/hubla-cli-home/.agents/skills/hubla-cli/SKILL.md
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and scanners
        run: python -m pip install -e . bandit pip-audit
      - name: Static security scan
        run: bandit -r src/hubla_cli -q
      - name: Dependency vulnerability scan
        run: pip-audit --local
