[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hubla-cli"
version = "0.2.1"
description = "CLI e TUI não oficiais para gerenciar uma conta Hubla, feitos para pessoas e agentes de IA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Felipe Azambuja"},
]
keywords = ["hubla", "cli", "tui", "ai-agents", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "keyring>=25.6,<27",
    "platformdirs>=4.3,<5",
    "prompt-toolkit>=3.0.51,<4",
    "requests>=2.32.3,<3",
    "rich>=14,<15",
    "tzdata>=2025.2,<2027",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pexpect>=4.9; platform_system != 'Windows'",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
hubla-cli = "hubla_cli.cli:main"
hubla = "hubla_cli.cli:main"

[project.urls]
Homepage = "https://github.com/pycodebr/hubla-cli"
Documentation = "https://github.com/pycodebr/hubla-cli#readme"
Issues = "https://github.com/pycodebr/hubla-cli/issues"
Source = "https://github.com/pycodebr/hubla-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hubla_cli = ["data/SKILL.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
